<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relatório de acompanhamento</title>
<script>
// Link de cliente cuja página de prévia ainda não está no ar: segue direto para o formulário
(function () {
  var p = location.pathname.split('/').filter(Boolean);
  var root = '/' + (p.length > 1 ? p[0] + '/' : '');
  if (/[?&]t=/.test(location.search)) location.replace(root + location.search + location.hash);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;background:#F5F5F7;color:#1D1D1F;text-align:center;padding:24px}p{color:#6E6E73}</style>
</head>
<body><div><h2>Página não encontrada</h2><p>Abra o link exatamente como foi enviado para você.</p></div></body>
</html>
